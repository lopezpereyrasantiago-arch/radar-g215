<style>
/* Hermana del Radar: mismas tintas. Tablero de consulta: filtros arriba, pestañas, tablas densas con tiras de puntos. */
:root{
  --ground:#F1F4F2; --surface:#FFFFFF; --sunk:#E7ECE9; --ink:#18221F; --muted:#56655F; --line:#D3DAD4;
  --accent:#1D5C78; --accent-ink:#FFFFFF; --accent-soft:#DCEAF0; --ocre:#8E6118; --ocre-soft:#F4E8D2;
  --ok:#2F7A4B; --ok-soft:#DDEFE3; --warn:#A5561B; --warn-soft:#F7E3D3; --dot:#2F7792; --dot-soft:rgba(47,119,146,.28);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111715; --surface:#1A2220; --sunk:#232D2A; --ink:#E4EAE6; --muted:#9AA8A2; --line:#2F3B37;
  --accent:#7DB8D3; --accent-ink:#0C2029; --accent-soft:#1D3440; --ocre:#D9A954; --ocre-soft:#3A2F1C;
  --ok:#7CC796; --ok-soft:#1E3526; --warn:#E59A5E; --warn-soft:#3B2A1C; --dot:#7DBCD6; --dot-soft:rgba(125,188,214,.32);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#111715; --surface:#1A2220; --sunk:#232D2A; --ink:#E4EAE6; --muted:#9AA8A2; --line:#2F3B37;
  --accent:#7DB8D3; --accent-ink:#0C2029; --accent-soft:#1D3440; --ocre:#D9A954; --ocre-soft:#3A2F1C;
  --ok:#7CC796; --ok-soft:#1E3526; --warn:#E59A5E; --warn-soft:#3B2A1C; --dot:#7DBCD6; --dot-soft:rgba(125,188,214,.32);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{font:13px/1.45 var(--mono);color:var(--muted);text-align:right}
.meta b{color:var(--ink);font-weight:500}
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--body);border-radius:8px;padding:9px 13px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:500 24px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select,input[type=search],input[type=month],input[type=text]{font:14px var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding-bottom:6px}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{appearance:none;cursor:pointer;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:700 15px/1 var(--display);font-stretch:88%;padding:10px 12px 9px;letter-spacing:.01em}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab span{font:400 12px var(--mono);margin-left:5px;color:var(--muted)}

.panel{display:flex;flex-direction:column;gap:14px}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ptools .h{font-size:13.5px;color:var(--muted);flex:1 1 260px;max-width:80ch}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
th.s[aria-sort]::after{content:" ↓";color:var(--accent)}
th.s[aria-sort="ascending"]::after{content:" ↑"}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr.me td{background:var(--accent-soft)}
td .sub{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font:500 11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.of{background:var(--ok-soft);color:var(--ok)}
.pill.po{background:var(--accent-soft);color:var(--accent)}
.pill.sec{background:var(--warn-soft);color:var(--warn)}
.pill.win{background:var(--ocre-soft);color:var(--ocre)}
.pill.small{background:var(--sunk);color:var(--muted)}
.neg{color:var(--ok)} .pos{color:var(--warn)}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.strip{display:block}
.strip text{font:10px var(--mono);fill:var(--muted)}
.note{font-size:13.5px;color:var(--muted);max-width:85ch}

/* ficha de empresa */
.ficha{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.ficha h2{font:800 clamp(22px,3vw,30px)/1.1 var(--display);font-stretch:82%;margin:0;text-wrap:balance}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.fgrid dt{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fgrid dd{margin:0;font:500 18px var(--mono);font-variant-numeric:tabular-nums}

/* calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.calc h3,.sec h3{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.calc .ins{display:flex;flex-direction:column;gap:10px;min-width:0}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.read div{background:var(--ground);border-radius:8px;padding:8px 10px}
.read .l{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.read .v{font:500 17px var(--mono);font-variant-numeric:tabular-nums}
.read .m{font:12px var(--mono);color:var(--muted)}
.curve text{font:11px var(--mono);fill:var(--muted)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.method section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.method h3{font:700 15px var(--display);margin:0 0 6px}
.method p,.method li{font-size:14px;margin:0 0 6px}
.method code{font:13px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.ofl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ofl .r{display:flex;justify-content:space-between;gap:12px}
/* empresas y contactos */
.csum{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 11px}
.chip b{font:500 12.5px var(--mono);color:var(--ink);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:var(--accent-ink)}
.cl{display:flex;flex-direction:column;gap:6px;min-width:230px}
.ci{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.35}
.ci .t{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ci .d{font:12px var(--mono);color:var(--muted)}
.ci .lic{color:var(--ink)}
.ci .resp{color:var(--ok)}
.pill.gen{background:var(--accent-soft);color:var(--accent)}
.pill.esp{background:var(--ok-soft);color:var(--ok)}
.pill.err{background:var(--warn-soft);color:var(--warn)}
.cc{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:170px}
.cc a{overflow-wrap:anywhere}
.nx{font:600 13px var(--body);white-space:nowrap}
.nx.mail{color:var(--accent)} .nx.tel{color:var(--ocre)} .nx.busc{color:var(--muted)} .nx.ok{color:var(--ok)}
.fc{font-size:12px;color:var(--muted);line-height:1.35;max-width:300px;overflow-wrap:anywhere}
.fc .fk{font-weight:600}
details.pp{margin-top:6px;font-size:13px}
details.pp summary{cursor:pointer;color:var(--accent);font:600 13px var(--body);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.pp summary::-webkit-details-marker{display:none}
details.pp summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.pp[open] summary::before{transform:rotate(90deg)}
.ppl{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:8px 10px;background:var(--ground);border-radius:8px;max-width:420px}
.pe{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.pr{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.pi{display:flex;flex-direction:column;gap:1px;line-height:1.3;padding:2px 0}
.pi a{font-weight:600;text-decoration:none}
.pi a:hover{text-decoration:underline}
.pi .c{color:var(--muted);font-size:12.5px}
.pf{font:11px var(--mono);color:var(--muted)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:13px var(--body);cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
/* análisis ampliado de precios */
.stripbtn{appearance:none;border:1px solid transparent;background:none;padding:2px 4px;border-radius:6px;cursor:zoom-in;display:flex;flex-direction:column;align-items:flex-start;gap:1px;color:inherit}
.stripbtn:hover{border-color:var(--line);background:var(--sunk)}
.stripbtn .zl{font:500 10.5px var(--mono);color:var(--accent);letter-spacing:.04em}
.glink{appearance:none;border:0;background:none;padding:0;text-align:left;font:700 14px var(--body);color:var(--ink);cursor:pointer}
.glink:hover{color:var(--accent);text-decoration:underline}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.box .bh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 12px/1 var(--mono);padding:7px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chartwrap{overflow-x:auto;min-width:0}
.chartwrap svg{display:block}
.viz text{font:11px var(--mono);fill:var(--muted)}
.viz text.lab{fill:var(--ink);font:12px var(--body)}
.viz text.lab.dim{fill:var(--muted)}
.viz text.strong{fill:var(--ink);font-weight:500}
.viz .hit{fill:transparent;cursor:crosshair}
.viz .row:hover .rowbg{fill:var(--sunk)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.ln{width:16px;height:2px;border-radius:1px;vertical-align:3px}
.legend i.bd{width:16px;height:10px;border-radius:2px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;line-height:1.35;max-width:320px}
.tip b{font-weight:700}
.tip .m{font:12px var(--mono);color:var(--muted)}
.gkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gkpis div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gkpis .l{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gkpis .v{font:500 19px var(--mono);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.full:fullscreen{background:var(--surface);padding:20px;overflow:auto}
@media (max-width:820px){.two{grid-template-columns:1fr}}
@media (max-width:600px){.gkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .calc{grid-template-columns:1fr}
  .meta{text-align:left}.hright{align-items:flex-start}.hbtns{justify-content:flex-start}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf1=new Intl.NumberFormat('es-AR',{maximumFractionDigits:1});
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const RUBROS=["Energía","Vial y transporte","Agua y saneamiento","Hidráulica","Arquitectura y edificios públicos","Vivienda y urbanismo","Ambiental y residuos","Consultoría e ingeniería","Otros"];
function money(v,cur){ if(v==null) return '—'; const p=cur==='USD'?'USD ':'$ ';
  if(Math.abs(v)>=1e9) return p+nf1.format(v/1e9)+' mil M'; if(Math.abs(v)>=1e6) return p+nf1.format(v/1e6)+' M'; return p+nf0.format(v); }
const pct=(d,dec=1)=>d==null||!isFinite(d)?'—':(d>0?'+':'')+(d*100).toFixed(dec).replace('.',',')+' %';
const pctc=d=>d==null?'—':`<span class="${d<0?'neg':d>0?'pos':''}">${pct(d)}</span>`;
const fdate=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—';
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}

/* ---------- normalización de empresas (misma regla que la rutina) ---------- */
const plain=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const SUF=new Set(['sa','s','a','srl','sas','saic','saicfi','sacif','saci','sacifia','sacfi','scs','se','ltda','cia','y','de','la','el']);
let ALIAS={centroconstrucciones:'cecosa'};
const DISPLAY_FIX={cecosa:'Centro Construcciones S.A. (ex CECOSA)'};
function normEmp(s){
  let t=plain(s).replace(/\([^)]*\)/g,' ');
  t=t.replace(/^\s*(ut|ute|utes|union transitoria( de empresas)?|consorcio)\b[\s:.-]*/,'');
  t=t.replace(/\b(u\.t\.?|ute?)\s*$/,' ').replace(/^\s*(empresa\s+)?constructora\s+/,'');
  const k=(t.match(/[a-z0-9]+/g)||[]).filter(w=>!SUF.has(w)).join('');
  return ALIAS[k]||k;
}
function miembros(nombre){
  let t=String(nombre||'').trim();
  t=t.replace(/\s*\((?:con |grupo).*$/i,'');
  t=t.replace(/^\s*(UTE?|Consorcio)\s+/i,'');
  const m=t.match(/^"[^"]*"\s*\((.*)\)\s*$/); if(m) t=m[1];

function mes(s){return s?String(s).slice(0,7):null;}
function factor(r){ // ICC(apertura)/ICC(base)

  const b=mes(r.fecha_base_po)||mes(r.fecha_publicacion), a=mes(r.fecha_apertura)||mes(r.fecha_adjudicacion);
  if(!a||!b||a===b) return {f:1,ok:a&&b?true:false};
  if(ICC[a]&&ICC[b]) return {f:ICC[a]/ICC[b],ok:true};
  return {f:1,ok:false};
}
/* ---------- derivados por licitación ---------- */
function derive(r){
  const po=(r.presupuesto_oficial>0&&!r.excluir_precios)?r.presupuesto_oficial:null;
  const fx=po?factor(r):{f:1,ok:false};
  const ofs=(r.oferentes||[]).map(o=>{const k=normEmp(o.empresa);const mem=miembros(o.empresa).map(normEmp);
    let d=null,ratio=null,out=false;
    if(po&&o.monto>0){ratio=o.monto/(po*fx.f); if(ratio<0.4||ratio>2.5) out=true; else d=ratio-1;}
    return {...o,k,mem,d,out};});
  const g=r.ganador&&r.ganador.empresa?{...r.ganador,k:normEmp(r.ganador.empresa),mem:miembros(r.ganador.empresa).map(normEmp)}:null;
  if(g&&!ofs.some(o=>o.k===g.k)) ofs.push({empresa:g.empresa,monto:g.monto,admitida:true,k:g.k,mem:g.mem,d:null,out:false,soloGanador:true});
  const priced=ofs.filter(o=>o.monto>0&&o.admitida!==false).sort((a,b)=>a.monto-b.monto);
  const decided=['adjudicada','preadjudicada','fracasada','desierta','anulada'].includes(r.estado);
  let winLow=null, margen=null, dWin=null, dMin=null;
  if(priced.length) dMin=priced[0].d;
  if(g&&(r.estado==='adjudicada'||r.estado==='preadjudicada')){
    const w=ofs.find(o=>o.k===g.k); const wm=g.monto||(w&&w.monto);
    if(w) dWin=w.d;
    if(wm&&priced.length>=2){ winLow=Math.abs(wm-priced[0].monto)<=0.001*wm;
      if(winLow) margen=(priced[1].monto-wm)/wm; }
  }
  const fref=r.fecha_adjudicacion||r.fecha_apertura||r.fecha_publicacion||null;
  return {...r,_po:po,_fx:fx,_ofs:ofs,_g:g,_priced:priced,_decided:decided,_winLow:winLow,_margen:margen,_dWin:dWin,_dMin:dMin,_fref:fref};
}

function empresas(L){

  for(const r of L){

      keys.forEach((k,idx)=>{ if(!k||seen.has(k)) return; seen.add(k);
        const nm=o.mem.length>1?miembros(o.empresa)[idx]:o.empresa;
        const e=get(k,nm); e.pres++; if(o.mem.length>1) e.ut++;
        e.jur[r.jurisdiccion]=(e.jur[r.jurisdiccion]||0)+1; e.rub[r.rubro]=(e.rub[r.rubro]||0)+1;
        const won=r._g&&(r._g.k===o.k)&&(r.estado==='adjudicada'||r.estado==='preadjudicada');
        if(r._decided) e.dec++;
        if(won){ e.gan++; if(r._margen!=null) e.margs.push(r._margen); }
        if(o.d!=null) e.ds.push(o.d);
        e.lics.push({r,o,won});
      });
    }
  }
  return Object.values(E).map(e=>{
    const nm=Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0];
    return {...e,name:DISPLAY_FIX[e.k]||nm,tasa:e.dec?e.gan/e.dec:null,dmed:median(e.ds),marg:mean(e.margs),

}

let TIP=null;
function tipShow(ev,html){ if(!TIP){TIP=document.createElement('div');TIP.className='tip';TIP.setAttribute('role','status');document.body.appendChild(TIP);}
  TIP.innerHTML=html; TIP.hidden=false; const pad=14, w=TIP.offsetWidth, h=TIP.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY+pad; if(x+w>innerWidth-8) x=ev.clientX-w-pad; if(y+h>innerHeight-8) y=ev.clientY-h-pad;
  TIP.style.left=Math.max(8,x)+'px'; TIP.style.top=Math.max(8,y)+'px'; }
function tipHide(){ if(TIP) TIP.hidden=true; }
function bindTips(root,get){
  root.querySelectorAll('[data-tip]').forEach(el=>{
    const h=()=>get(el.dataset.tip);

const pctAxis=d=>d===0?'0':(d>0?'+':'−')+Math.round(Math.abs(d*100))+'%';

  if(!ds.length) return [-0.4,0.4];

const perLabel=k=>{ if(/T/.test(k)){const [y,t]=k.split('-T'); return t+'T '+y.slice(2);} const [y,m]=k.split('-'); return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]+' '+y.slice(2); };

/* histograma de desvíos: ganadores apilados en ocre */

function calcHTML(C){
  return `<div class="calc"><div class="ins">

function wireCalc(C){
  const draw=()=>{
    const g=C.find(x=>x.k===S.calcG)||C[0]; const dm=g.dmin; const n=dm.length;
    const P=d=>dm.filter(v=>v>d).length/n; // probabilidad empírica de quedar primero
    const po=parseFloat(String(S.calcPO).replace(/\./g,'').replace(',','.'));
    const at=p=>{ // mayor desvío d con P(d) >= p
      let best=null; for(let d=0.5;d>=-0.6;d-=0.0025){ if(P(d)>=p){best=d;break;} } return best; };
    const R3=[0.5,0.7,0.9].map(p=>({p,d:at(p)}));
    $('cread').innerHTML=R3.map(x=>`<div><div class="l">${Math.round(x.p*100)} % de chance</div><div class="v">${x.d==null?'—':pct(x.d)}</div><div class="m">${x.d!=null&&po>0?money(po*(1+x.d),'ARS'):'&nbsp;'}</div></div>`).join('');
    $('cnote').innerHTML=`Basado en ${n} licitaciones de “${esc(g.k)}”. Muestra con qué desvío respecto del presupuesto oficial tu oferta habría quedado más baja que todas las demás en esa proporción de casos. Supone que gana la oferta más baja admitida; en este grupo eso pasó en ${g.wl.length?Math.round(mean(g.wl)*100)+' %':'— (sin dato)'} de las adjudicaciones.${n<8?' <b>Muestra chica:</b> usalo como orientación.':''}`;
    // curva
    const W=520,H=230,ml=44,mr=12,mt=12,mb=34,lo=-0.4,hi=0.3;
    const X=d=>ml+(d-lo)/(hi-lo)*(W-ml-mr), Y=p=>mt+(1-p)*(H-mt-mb);
    let path=''; for(let d=lo;d<=hi+1e-9;d+=0.005){ path+=(path?'L':'M')+X(d).toFixed(1)+','+Y(P(d)).toFixed(1); }
    const xt=[-0.4,-0.3,-0.2,-0.1,0,0.1,0.2,0.3], yt=[0,0.25,0.5,0.75,1];
    const pts=dm.filter(v=>v>=lo&&v<=hi).map(v=>`<circle cx="${X(v).toFixed(1)}" cy="${H-mb+8}" r="3" fill="var(--dot-soft)" stroke="var(--dot)"><title>Oferta más baja: ${pct(v)}</title></circle>`).join('');
    $('ccurve').innerHTML=`<svg class="curve" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Probabilidad de ser la oferta más baja según el desvío">
      ${yt.map(p=>`<line x1="${ml}" x2="${W-mr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${ml-6}" y="${Y(p)+4}" text-anchor="end">${p*100} %</text>`).join('')}
      ${xt.map(d=>`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d===0?'0':(d>0?'+':'−')+Math.abs(d*100)+'%'}</text>`).join('')}
      <line x1="${X(0)}" x2="${X(0)}" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-dasharray="3 3"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${R3.filter(x=>x.d!=null&&x.d>=lo&&x.d<=hi).map(x=>`<circle cx="${X(x.d)}" cy="${Y(P(x.d))}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${Math.round(x.p*100)} %: ${pct(x.d)}</title></circle>`).join('')}
      ${pts}</svg><div class="note">Eje horizontal: oferta respecto del presupuesto oficial. Vertical: proporción de licitaciones en las que esa oferta habría sido la más baja. Los puntos de abajo son la oferta más baja de cada licitación del grupo.</div>`;
  };
  $('cg').onchange=e=>{S.calcG=e.target.value; draw();};
  $('cpo').oninput=e=>{S.calcPO=e.target.value; draw();};
  draw();
}

/* ---------- G215 versión pública: Enviados del Radar en vivo + Registro ---------- */
let ENVLIVE=[], EVENTOS=[], EVOK=false, EVERR=false;
const fmtD=f=>{ const m=String(f||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:String(f||''); };
function mergeLive(c){
  const base=(c.contactos||[]).slice(); if(!ENVLIVE.length) return base;
  const em=String(c.email||'').toLowerCase(), extra=String(c.emails_extra||'').toLowerCase();
  const keys=new Set([c.empresa,...String(c.otros_nombres||'').split(';')].map(x=>x&&normEmp(x)).filter(Boolean));
  ENVLIVE.forEach(d=>{ const lic=String((d.data&&d.data.licitacion)||'');
    ((d.data&&d.data.registros)||[]).forEach(r=>{ if(r.tipo!=='enviado') return;
      const re=String(r.email||'').toLowerCase();
      const hit=(re&&(re===em||(extra&&extra.includes(re))))||(r.empresa&&keys.has(normEmp(r.empresa)));
      if(!hit) return;
      const dup=base.some(x=>String(x.email||c.email||'').toLowerCase()===re&&(String(x.licitacion||'')===lic||fkey(x.fecha)===String(r.fecha||'').slice(0,10)));
      if(dup) return;
      base.push({fecha:fmtD(r.fecha),tipo:'especifico',licitacion:lic,estado:'Enviado',email:r.email,_live:true}); }); });
  return base;
}
function liveRender(tab){
  if(S.tab!==tab) return;
  const a=document.activeElement; if(a&&$('out').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
const EVT={enviado:'Marcó enviado',correo_abierto:'Abrió el correo',borrador:'Preparó borrador',envio_destildado:'Destildó un envío',novedad_quitada:'Quitó la novedad',novedad_restaurada:'Restauró la novedad',importado:'Marca importada de Claude'};
function evFecha(e){ try{ if(e.ts&&e.ts.toDate) return e.ts.toDate(); }catch(x){} return e.cuando?new Date(e.cuando):null; }
const fdt=d=>d?d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function evFiltrados(){
  const q=plain(S.rq||'');
  return EVENTOS.map(d=>d.data||{}).filter(e=>(!S.rt||e.tipo===S.rt)&&(!S.rw||e.quien===S.rw)&&(!q||plain([e.quien,e.licitacion,e.objeto,e.empresa,e.email,e.jurisdiccion,e.detalle].join(' ')).includes(q)));
}
function renderRegistro(){
  $('c-registro').textContent=EVENTOS.length||'';
  if(!EVOK){ $('out').innerHTML=`<div class="empty">${EVERR?'No se pudo conectar con el registro. Recargá la página.':'Cargando el registro…'}</div>`; return; }
  const L=evFiltrados();
  const tipos=[...new Set(EVENTOS.map(d=>d.data&&d.data.tipo).filter(Boolean))];
  const quienes=[...new Set(EVENTOS.map(d=>d.data&&d.data.quien).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  $('out').innerHTML=`<div class="panel">
    <div class="ptools"><input type="search" id="rq" placeholder="Buscar persona, licitación, empresa o email…" value="${esc(S.rq||'')}" aria-label="Buscar en el registro" style="flex:1 1 240px">
      <div class="f"><label for="rt">Acción</label><select id="rt"><option value="">Todas</option>${tipos.map(t=>`<option value="${esc(t)}"${S.rt===t?' selected':''}>${esc(EVT[t]||t)}</option>`).join('')}</select></div>
      <div class="f"><label for="rw">Quién</label><select id="rw"><option value="">Todos</option>${quienes.map(t=>`<option${S.rw===t?' selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <button class="btn" id="rx" type="button">Exportar registro</button>
      <span class="h">Cada marca que se hace en el Radar queda acá con quién la hizo y cuándo, en el momento. El registro no se puede borrar ni editar desde la página. Los filtros de arriba no aplican a esta pestaña.</span></div>
    ${L.length?`<div class="tw"><table><tr><th>Fecha y hora</th><th>Quién</th><th>Acción</th><th>Licitación</th><th>Empresa</th><th>Detalle</th></tr>
      ${L.slice(0,1000).map(e=>`<tr><td class="n">${fdt(evFecha(e))}</td><td><b>${esc(e.quien)}</b></td>
        <td><span class="pill ${/enviado|importado/.test(e.tipo)?'win':/destild|restaur/.test(e.tipo)?'sec':''}">${esc(EVT[e.tipo]||e.tipo)}</span></td>
        <td style="min-width:220px">${esc(e.objeto||e.licitacion||'')}<div class="sub">${esc([e.jurisdiccion,e.licitacion&&e.objeto?e.licitacion:''].filter(Boolean).join(' · '))}</div></td>
        <td style="min-width:170px">${esc(e.empresa||'')}${e.email?`<div class="sub">${esc(e.email)}</div>`:''}</td>
        <td><span class="sub">${esc(e.detalle||'')}</span></td></tr>`).join('')}
    </table></div>${L.length>1000?`<div class="note">Se muestran los 1000 más recientes de ${L.length}. Exportá para verlos todos.</div>`:''}`
    :`<div class="empty">${EVENTOS.length?'Ningún evento coincide con la búsqueda.':'Todavía no hay marcas registradas. Cuando alguien tilde "Enviado" o "Quitar novedad" en el Radar, aparece acá.'}</div>`}
  </div>`;
  $('rq').oninput=e=>{S.rq=e.target.value; const p=e.target.selectionStart; render(); const n=$('rq'); if(n){n.focus(); n.setSelectionRange(p,p);} };
  $('rt').onchange=e=>{S.rt=e.target.value; render();};
  $('rw').onchange=e=>{S.rw=e.target.value; render();};
  $('rx').onclick=exportRegistro;
}
async function exportRegistro(){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el generador de Excel. Recargá la página.'); return; }
  const rows=evFiltrados().map(e=>({Fecha_hora:fdt(evFecha(e)),Quien:e.quien||'',Accion:EVT[e.tipo]||e.tipo||'',Licitacion:e.licitacion||'',Objeto:e.objeto||'',Jurisdiccion:e.jurisdiccion||'',Empresa:e.empresa||'',Email:e.email||'',Detalle:e.detalle||'',Id_licitacion:e.lic_id||''}));

  const dl=await window.claude.use('downloads'); await dl.save({filename:'registro-marcas-radar.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})}); toast('Registro exportado');
}

  const pr=grupos(L).map(g=>({Grupo:g.k,Agrupado_por:GRP[S.grp].t,Licitaciones:g.lics.length,Ofertas:g.ds.length,Mediana:median(g.ds),P25:quant(g.ds,.25),P75:quant(g.ds,.75),Oferta_mas_baja_mediana:median(g.dmin)??'',Ganador_mediana:median(g.dwin)??'',Oferentes_promedio:mean(g.nof),Gano_la_mas_baja:g.wl.length?mean(g.wl):'',Margen_al_2do_mediana:g.marg.length?median(g.marg):''}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lic),'Licitaciones');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(of),'Ofertas');

  if(CONTOK){

      Fuente_contacto:c.fuente_contacto||'',Fecha_busqueda:c.fecha_busqueda||'',Personas_LinkedIn:c._ps.reduce((s,p)=>s+(p.personas||[]).length,0),Proximo_paso:NX[c._next]}));

/* ---------- carga desde la base ---------- */
async function load(){
  let db=null; try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(!db){ $('meta').textContent='Sin conexión con la base'; $('out').innerHTML='<div class="empty">No se pudo leer la base histórica. Recargá la página.</div>'; return; }
  DB=db;
  try{
    const [lic,cfg,fu]=await Promise.all([db.collection('licitaciones').limit(1000).get(),db.doc('config/indices').get(),db.collection('fuentes').limit(100).get()]);
    R=lic.docs.map(d=>({id:d.id,...d.data()}));
    if(cfg.exists){ const c=cfg.data(); ICC=c.icc||{}; ICCMETA=c; }
    FUENTES=fu.docs.map(d=>d.data());
    const m=await db.doc('config/meta').get(); if(m.exists) META=m.data();
    const a=await db.doc('config/alias').get(); if(a.exists&&a.data().pares) a.data().pares.forEach(([x,y])=>{ALIAS[x]=y;});
    try{ const ct=await db.collection('contactos').limit(200).get();
      CONT=ct.docs.map(d=>d.data()).sort((x,y)=>(x.lote||0)-(y.lote||0)).flatMap(d=>Array.isArray(d.items)?d.items:[]);
      CONTOK=CONT.length>0; }catch(e){ CONTOK=false; }
    try{ const pp=await db.collection('personas').limit(50).get();
      PERS=pp.docs.map(d=>d.data()).sort((x,y)=>(x.lote||0)-(y.lote||0)).flatMap(d=>Array.isArray(d.items)?d.items:[]); }catch(e){ PERS=[]; }
    indexPersonas();
  }catch(e){ $('meta').textContent='No se pudo leer la base ('+(e&&e.code||'error')+')'; return; }
  if(!R.length){ $('meta').textContent='Base vacía'; $('out').innerHTML='<div class="empty">La base todavía no tiene licitaciones. La rutina diaria del Radar las carga en su próxima corrida.</div>'; return; }
  const fr=R.map(r=>r.fecha_adjudicacion||r.fecha_apertura||r.fecha_publicacion).filter(Boolean).sort();
  $('meta').innerHTML=`<b>${R.length}</b> licitaciones · ${fdate(fr[0])} al ${fdate(fr[fr.length-1])}<br>Actualizada ${fdate(META.actualizado)}`;
  $('xlsBtn').disabled=false;
  D=R.map(derive); selects(); render();
  if(db.live){
    db.live('envios',docs=>{ ENVLIVE=docs; liveRender('contactos'); });
    db.live('eventos',docs=>{ EVENTOS=docs; EVOK=true; if(S.tab==='registro') liveRender('registro'); else $('c-registro').textContent=docs.length||''; },{orderBy:'ts',dir:'desc',limit:3000})
      .then(u=>{ if(!u){ EVERR=true; liveRender('registro'); } });
  }
}

try{const th=localStorage.getItem('radar-theme'); if(th==='dark'||th==='light') root.setAttribute('data-theme',th);}catch(e){}

paint(); render(); load();
})();
