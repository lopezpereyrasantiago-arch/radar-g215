<style>
/* Hermana del Radar: mismas tintas. Tablero de consulta: filtros arriba, pestañas, tablas densas con tiras de puntos. */
:root{
  --ground:#F1F4F2; --surface:#FFFFFF; --sunk:#E7ECE9; --ink:#18221F; --muted:#56655F; --line:#D3DAD4;
  --accent:#1D5C78; --accent-ink:#FFFFFF; --accent-soft:#DCEAF0; --ocre:#8E6118; --ocre-soft:#F4E8D2;
  --ok:#2F7A4B; --ok-soft:#DDEFE3; --warn:#A5561B; --warn-soft:#F7E3D3; --dot:#2F7792; --dot-soft:rgba(47,119,146,.28);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111715; --surface:#1A2220; --sunk:#232D2A; --ink:#E4EAE6; --muted:#9AA8A2; --line:#2F3B37;
  --accent:#7DB8D3; --accent-ink:#0C2029; --accent-soft:#1D3440; --ocre:#D9A954; --ocre-soft:#3A2F1C;
  --ok:#7CC796; --ok-soft:#1E3526; --warn:#E59A5E; --warn-soft:#3B2A1C; --dot:#7DBCD6; --dot-soft:rgba(125,188,214,.32);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#111715; --surface:#1A2220; --sunk:#232D2A; --ink:#E4EAE6; --muted:#9AA8A2; --line:#2F3B37;
  --accent:#7DB8D3; --accent-ink:#0C2029; --accent-soft:#1D3440; --ocre:#D9A954; --ocre-soft:#3A2F1C;
  --ok:#7CC796; --ok-soft:#1E3526; --warn:#E59A5E; --warn-soft:#3B2A1C; --dot:#7DBCD6; --dot-soft:rgba(125,188,214,.32);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{font:13px/1.45 var(--mono);color:var(--muted);text-align:right}
.meta b{color:var(--ink);font-weight:500}
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--body);border-radius:8px;padding:9px 13px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--ink)}

.btn:disabled{opacity:.5;cursor:default}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}

.strip{display:block}
.strip text{font:10px var(--mono);fill:var(--muted)}
.note{font-size:13.5px;color:var(--muted);max-width:85ch}

/* ficha de empresa */
.ficha{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.ficha h2{font:800 clamp(22px,3vw,30px)/1.1 var(--display);font-stretch:82%;margin:0;text-wrap:balance}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.fgrid dt{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fgrid dd{margin:0;font:500 18px var(--mono);font-variant-numeric:tabular-nums}

/* calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.calc h3,.sec h3{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.07em;margin:0;color:var(--muted)}
.calc .ins{display:flex;flex-direction:column;gap:10px;min-width:0}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.read div{background:var(--ground);border-radius:8px;padding:8px 10px}
.read .l{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.read .v{font:500 17px var(--mono);font-variant-numeric:tabular-nums}
.read .m{font:12px var(--mono);color:var(--muted)}
.curve text{font:11px var(--mono);fill:var(--muted)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.method section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.method h3{font:700 15px var(--display);margin:0 0 6px}
.method p,.method li{font-size:14px;margin:0 0 6px}
.method code{font:13px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.ofl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ofl .r{display:flex;justify-content:space-between;gap:12px}
/* empresas y contactos */
.csum{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;font:500 12.5px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 11px}
.chip b{font:500 12.5px var(--mono);color:var(--ink);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:var(--accent-ink)}
.cl{display:flex;flex-direction:column;gap:6px;min-width:230px}
.ci{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.35}
.ci .t{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ci .d{font:12px var(--mono);color:var(--muted)}
.ci .lic{color:var(--ink)}
.ci .resp{color:var(--ok)}
.pill.gen{background:var(--accent-soft);color:var(--accent)}
.pill.esp{background:var(--ok-soft);color:var(--ok)}
.pill.err{background:var(--warn-soft);color:var(--warn)}
.cc{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:170px}
.cc a{overflow-wrap:anywhere}
.nx{font:600 13px var(--body);white-space:nowrap}
.nx.mail{color:var(--accent)} .nx.tel{color:var(--ocre)} .nx.busc{color:var(--muted)} .nx.ok{color:var(--ok)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:13px var(--body);cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
@media (max-width:720px){
  .calc{grid-template-columns:1fr}
  .meta{text-align:left}.hright{align-items:flex-start}.hbtns{justify-content:flex-start}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf1=new Intl.NumberFormat('es-AR',{maximumFractionDigits:1});
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const RUBROS=["Energía","Vial y transporte","Agua y saneamiento","Hidráulica","Arquitectura y edificios públicos","Vivienda y urbanismo","Ambiental y residuos","Consultoría e ingeniería","Otros"];
function money(v,cur){ if(v==null) return '—'; const p=cur==='USD'?'USD ':'$ ';
  if(Math.abs(v)>=1e9) return p+nf1.format(v/1e9)+' mil M'; if(Math.abs(v)>=1e6) return p+nf1.format(v/1e6)+' M'; return p+nf0.format(v); }
const pct=(d,dec=1)=>d==null||!isFinite(d)?'—':(d>0?'+':'')+(d*100).toFixed(dec).replace('.',',')+' %';
const pctc=d=>d==null?'—':`<span class="${d<0?'neg':d>0?'pos':''}">${pct(d)}</span>`;
const fdate=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—';
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}

/* ---------- normalización de empresas (misma regla que la rutina) ---------- */
const plain=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const SUF=new Set(['sa','s','a','srl','sas','saic','saicfi','sacif','saci','sacifia','sacfi','scs','se','ltda','cia','y','de','la','el']);
let ALIAS={centroconstrucciones:'cecosa'};
const DISPLAY_FIX={cecosa:'Centro Construcciones S.A. (ex CECOSA)'};
function normEmp(s){
  let t=plain(s).replace(/\([^)]*\)/g,' ');
  t=t.replace(/^\s*(ut|ute|utes|union transitoria( de empresas)?|consorcio)\b[\s:.-]*/,'');
  t=t.replace(/\b(u\.t\.?|ute?)\s*$/,' ').replace(/^\s*(empresa\s+)?constructora\s+/,'');
  const k=(t.match(/[a-z0-9]+/g)||[]).filter(w=>!SUF.has(w)).join('');
  return ALIAS[k]||k;
}
function miembros(nombre){
  let t=String(nombre||'').trim();
  t=t.replace(/\s*\((?:con |grupo).*$/i,'');
  t=t.replace(/^\s*(UTE?|Consorcio)\s+/i,'');
  const m=t.match(/^"[^"]*"\s*\((.*)\)\s*$/); if(m) t=m[1];
  t=t.replace(/\s*\(?\b(UTE?|U\.T\.?|consorcio)\)?\s*$/i,'').replace(/\([^)]*\)/g,'');
  const p=t.split(/\s+[-–]\s+/).map(s=>s.trim()).filter(Boolean);
  return p.length>1?p:[nombre];
}

/* ---------- estado ---------- */
const S={tab:'empresas',desde:'',hasta:'',jur:'',mun:'',rub:'',sec:true,icc:true,q:'',empSort:['pres','desc'],empSel:null,grp:'org_rub',licQ:'',calcG:'',calcPO:'',cq:'',cf:'todas',co:'pres',rq:'',rt:'',rw:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('memoria-lic-v1')||'{}'));S.empSel=null;}catch(e){}
const save=()=>{try{const {tab,grp,sec,icc,empSort,cf,co}=S;localStorage.setItem('memoria-lic-v1',JSON.stringify({tab,grp,sec,icc,empSort,cf,co}))}catch(e){}};
let R=[], ICC={}, ICCMETA={}, FUENTES=[], META={}, DB=null, CONT=[], CONTOK=false;

/* ---------- índice de costo de la construcción ---------- */
function mes(s){return s?String(s).slice(0,7):null;}
function factor(r){ // ICC(apertura)/ICC(base)
  if(!S.icc) return {f:1,ok:false};
  const b=mes(r.fecha_base_po)||mes(r.fecha_publicacion), a=mes(r.fecha_apertura)||mes(r.fecha_adjudicacion);
  if(!a||!b||a===b) return {f:1,ok:a&&b?true:false};
  if(ICC[a]&&ICC[b]) return {f:ICC[a]/ICC[b],ok:true};
  return {f:1,ok:false};
}
/* ---------- derivados por licitación ---------- */
function derive(r){
  const po=(r.presupuesto_oficial>0&&!r.excluir_precios)?r.presupuesto_oficial:null;
  const fx=po?factor(r):{f:1,ok:false};
  const ofs=(r.oferentes||[]).map(o=>{const k=normEmp(o.empresa);const mem=miembros(o.empresa).map(normEmp);
    let d=null,ratio=null,out=false;
    if(po&&o.monto>0){ratio=o.monto/(po*fx.f); if(ratio<0.4||ratio>2.5) out=true; else d=ratio-1;}
    return {...o,k,mem,d,out};});
  const g=r.ganador&&r.ganador.empresa?{...r.ganador,k:normEmp(r.ganador.empresa),mem:miembros(r.ganador.empresa).map(normEmp)}:null;
  if(g&&!ofs.some(o=>o.k===g.k)) ofs.push({empresa:g.empresa,monto:g.monto,admitida:true,k:g.k,mem:g.mem,d:null,out:false,soloGanador:true});
  const priced=ofs.filter(o=>o.monto>0&&o.admitida!==false).sort((a,b)=>a.monto-b.monto);
  const decided=['adjudicada','preadjudicada','fracasada','desierta','anulada'].includes(r.estado);
  let winLow=null, margen=null, dWin=null, dMin=null;
  if(priced.length) dMin=priced[0].d;
  if(g&&(r.estado==='adjudicada'||r.estado==='preadjudicada')){
    const w=ofs.find(o=>o.k===g.k); const wm=g.monto||(w&&w.monto);
    if(w) dWin=w.d;
    if(wm&&priced.length>=2){ winLow=Math.abs(wm-priced[0].monto)<=0.001*wm;
      if(winLow) margen=(priced[1].monto-wm)/wm; }
  }
  const fref=r.fecha_adjudicacion||r.fecha_apertura||r.fecha_publicacion||null;
  return {...r,_po:po,_fx:fx,_ofs:ofs,_g:g,_priced:priced,_decided:decided,_winLow:winLow,_margen:margen,_dWin:dWin,_dMin:dMin,_fref:fref};
}
let D=[];
function filtered(){
  return D.filter(r=>(!S.jur||r.jurisdiccion===S.jur)&&(!S.mun||r.municipio===S.mun)&&(!S.rub||r.rubro===S.rub)
    &&(S.sec||r.fuente_tipo!=='secundaria')
    &&(!S.desde||(r._fref&&mes(r._fref)>=S.desde))&&(!S.hasta||(r._fref&&mes(r._fref)<=S.hasta)));
}
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const quant=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);return s[lo]+(s[hi]-s[lo])*(p-lo);};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- empresas ---------- */
function empresas(L){
  const E={};
  const get=(k,name)=>{const e=E[k]||(E[k]={k,names:{},pres:0,dec:0,gan:0,ds:[],margs:[],jur:{},rub:{},ut:0,lics:[]}); e.names[name]=(e.names[name]||0)+1; return e;};
  for(const r of L){
    const seen=new Set();
    for(const o of r._ofs){
      const keys=o.mem.length>1?o.mem:[o.k];
      keys.forEach((k,idx)=>{ if(!k||seen.has(k)) return; seen.add(k);
        const nm=o.mem.length>1?miembros(o.empresa)[idx]:o.empresa;
        const e=get(k,nm); e.pres++; if(o.mem.length>1) e.ut++;
        e.jur[r.jurisdiccion]=(e.jur[r.jurisdiccion]||0)+1; e.rub[r.rubro]=(e.rub[r.rubro]||0)+1;
        const won=r._g&&(r._g.k===o.k)&&(r.estado==='adjudicada'||r.estado==='preadjudicada');
        if(r._decided) e.dec++;
        if(won){ e.gan++; if(r._margen!=null) e.margs.push(r._margen); }
        if(o.d!=null) e.ds.push(o.d);
        e.lics.push({r,o,won});
      });
    }
  }
  return Object.values(E).map(e=>{
    const nm=Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0];
    return {...e,name:DISPLAY_FIX[e.k]||nm,tasa:e.dec?e.gan/e.dec:null,dmed:median(e.ds),marg:mean(e.margs),
      jurTxt:Object.entries(e.jur).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).join(', '),
      rubTxt:Object.entries(e.rub).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).join(', ')};
  });
}

const CFILT=[
  ['todas','Todas',c=>true],
  ['contactadas','Contactadas',c=>c._sent],
  ['general','Contacto general',c=>c._cs.some(x=>x.tipo==='general')],
  ['especifico','Por licitación',c=>c._cs.some(x=>x.tipo==='especifico')],
  ['respondieron','Respondieron',c=>c._resp],
  ['escribir','Para escribir',c=>c._next==='mail'],
  ['llamar','Para llamar',c=>c._next==='tel'],
  ['sinmedio','Sin medio de contacto',c=>c._next==='busc'],
];
const RESP_EST=/respondi|reuni|cotizaci|no interesado|atendi/i;
function contactos(){
  const stats={}; empresas(D).forEach(e=>{stats[e.k]=e;});
  return CONT.map(c=>{
    const cs=mergeLive(c).sort((a,b)=>fkey(b.fecha).localeCompare(fkey(a.fecha)));
    const keys=[c.empresa,...String(c.otros_nombres||'').split(';')].map(s=>s&&normEmp(s)).filter(Boolean);
    const st=keys.map(k=>stats[k]).find(Boolean)||null;
    const sent=cs.some(x=>/enviado|respondi|reuni|cotizaci|interesado|atendi/i.test(x.estado||''));
    const resp=cs.some(x=>x.respuesta||RESP_EST.test(x.estado||''));
    const bounced=cs.length&&/error|rebot/i.test(cs[0].estado||'');
    let next;
    if(resp) next='seg'; else if(sent&&!bounced) next='esperar';
    else if(c.email&&!bounced) next='mail'; else if(c.telefono) next='tel'; else next='busc';
    return {...c,_cs:cs,_st:st,_sent:sent,_resp:resp,_next:next,_pres:st?st.pres:(c.ofertas||0),_gan:st?st.gan:(c.ganadas||0),
      _last:cs.length?fkey(cs[0].fecha):'',_txt:plain([c.empresa,c.otros_nombres,c.ciudad,c.jurisdicciones,c.email,c.licitaciones,...cs.map(x=>x.licitacion||'')].join(' '))};
  });
}
function fkey(f){ if(!f) return ''; const m=String(f).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m?`${m[3]}-${m[2]}-${m[1]}`:String(f); }
const NEXT={mail:['Escribir por mail','mail'],tel:['Llamar','tel'],busc:['Buscar contacto','busc'],esperar:['Esperar respuesta','ok'],seg:['Hacer seguimiento','ok']};
function estPill(e){ const t=String(e||''); return /error|rebot/i.test(t)?`<span class="pill err">${esc(t)}</span>`:RESP_EST.test(t)?`<span class="pill win">${esc(t)}</span>`:`<span class="pill">${esc(t)}</span>`; }

          :`<span class="pill">${c._next==='busc'?'Sin medio de contacto':'Sin contactar'}</span>`}</td>
        <td><span class="nx ${NEXT[c._next][1]}">${NEXT[c._next][0]}</span></td></tr>`).join('')}
    </table></div>${list.length>600?`<div class="note">Se muestran las primeras 600 de ${list.length}. Usá la búsqueda o los filtros para acotar.</div>`:''}`:'<div class="empty">Ninguna empresa coincide con la búsqueda o el filtro.</div>'}
  </div>`;
  $('out').querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{S.cf=b.dataset.cf; save(); render();});

  $('co').onchange=e=>{S.co=e.target.value; save(); render();};
  $('out').querySelectorAll('.linkbtn[data-k]').forEach(b=>b.onclick=()=>{S.tab='empresas'; S.empSel=b.dataset.k; save(); render(); window.scrollTo(0,0);});

/* ---------- precios ---------- */
const GRP={org_rub:{t:'Organismo y rubro',f:r=>(r.organismo||'Sin organismo')+' · '+r.rubro},org:{t:'Organismo',f:r=>r.organismo||'Sin organismo'},rub:{t:'Rubro',f:r=>r.rubro},jur:{t:'Jurisdicción',f:r=>r.jurisdiccion},jur_rub:{t:'Jurisdicción y rubro',f:r=>r.jurisdiccion+' · '+r.rubro}};
function grupos(L){
  const G={};
  for(const r of L){ const ds=r._ofs.filter(o=>o.d!=null); if(!ds.length) continue;
    const k=GRP[S.grp].f(r); const g=G[k]||(G[k]={k,lics:[],ds:[],dmin:[],dwin:[],nof:[],wl:[],marg:[]});
    g.lics.push(r); ds.forEach(o=>g.ds.push(o.d)); g.nof.push(r._priced.length);
    if(r._dMin!=null&&r._priced.length>=2) g.dmin.push(r._dMin);
    if(r._dWin!=null) g.dwin.push(r._dWin); if(r._winLow!=null) g.wl.push(r._winLow?1:0); if(r._margen!=null) g.marg.push(r._margen);
  }
  return Object.values(G).sort((a,b)=>b.lics.length-a.lics.length||b.ds.length-a.ds.length);
}
function strip(g){
  const W=170,H=26,lo=-0.4,hi=0.4,x=d=>8+(Math.max(lo,Math.min(hi,d))-lo)/(hi-lo)*(W-16);
  const dots=[];
  g.lics.forEach(r=>r._ofs.forEach(o=>{ if(o.d==null) return; const w=r._g&&r._g.k===o.k;
    dots.push(`<circle cx="${x(o.d).toFixed(1)}" cy="${w?9:15}" r="${w?4.5:3.5}" fill="${w?'var(--ocre)':'var(--dot-soft)'}" stroke="${w?'var(--surface)':'var(--dot)'}" stroke-width="${w?2:1}"><title>${esc(o.empresa)}: ${pct(o.d)}${w?' (ganó)':''}</title></circle>`);}));
  return `<svg class="strip" width="${W}" height="${H+10}" viewBox="0 0 ${W} ${H+10}" role="img" aria-label="Ofertas respecto del presupuesto oficial">
    <line x1="8" x2="${W-8}" y1="${H-2}" y2="${H-2}" stroke="var(--line)"/><line x1="${x(0)}" x2="${x(0)}" y1="2" y2="${H}" stroke="var(--muted)" stroke-dasharray="2 2"/>
    ${dots.join('')}<text x="8" y="${H+9}">−40%</text><text x="${x(0)-4}" y="${H+9}">0</text><text x="${W-36}" y="${H+9}">+40%</text></svg>`;
}
function renderPrecios(L){

      ${G.map(g=>`<tr><td><b>${esc(g.k)}</b>${g.lics.length<5?' <span class="pill small">muestra chica</span>':''}</td>
        <td class="n">${g.lics.length}</td><td class="n">${g.ds.length}</td><td>${strip(g)}</td>

    ${calcable.length?calcHTML(calcable):`<div class="note">La calculadora de oferta necesita al menos 3 licitaciones del mismo grupo con presupuesto oficial y 2 o más ofertas con monto. Probá agrupar por rubro o por jurisdicción.</div>`}

  $('grp').onchange=e=>{S.grp=e.target.value; save(); render();};
  if(calcable.length) wireCalc(calcable);

function calcHTML(C){
  return `<div class="calc"><div class="ins">
    <h3>Calculadora de oferta</h3>
    <div class="f"><label for="cg">Grupo de referencia</label><select id="cg">${C.map(g=>`<option${g.k===S.calcG?' selected':''}>${esc(g.k)}</option>`).join('')}</select></div>
    <div class="f"><label for="cpo">Presupuesto oficial de tu licitación (opcional)</label><input type="text" id="cpo" inputmode="decimal" placeholder="Ej. 5.400.000.000" value="${esc(S.calcPO)}"></div>
    <div class="read" id="cread"></div>
    <div class="note" id="cnote"></div>
  </div><div id="ccurve" style="min-width:0"></div></div>`;
}
function wireCalc(C){
  const draw=()=>{
    const g=C.find(x=>x.k===S.calcG)||C[0]; const dm=g.dmin; const n=dm.length;
    const P=d=>dm.filter(v=>v>d).length/n; // probabilidad empírica de quedar primero
    const po=parseFloat(String(S.calcPO).replace(/\./g,'').replace(',','.'));
    const at=p=>{ // mayor desvío d con P(d) >= p
      let best=null; for(let d=0.5;d>=-0.6;d-=0.0025){ if(P(d)>=p){best=d;break;} } return best; };
    const R3=[0.5,0.7,0.9].map(p=>({p,d:at(p)}));
    $('cread').innerHTML=R3.map(x=>`<div><div class="l">${Math.round(x.p*100)} % de chance</div><div class="v">${x.d==null?'—':pct(x.d)}</div><div class="m">${x.d!=null&&po>0?money(po*(1+x.d),'ARS'):'&nbsp;'}</div></div>`).join('');
    $('cnote').innerHTML=`Basado en ${n} licitaciones de “${esc(g.k)}”. Muestra con qué desvío respecto del presupuesto oficial tu oferta habría quedado más baja que todas las demás en esa proporción de casos. Supone que gana la oferta más baja admitida; en este grupo eso pasó en ${g.wl.length?Math.round(mean(g.wl)*100)+' %':'— (sin dato)'} de las adjudicaciones.${n<8?' <b>Muestra chica:</b> usalo como orientación.':''}`;
    // curva
    const W=520,H=230,ml=44,mr=12,mt=12,mb=34,lo=-0.4,hi=0.3;
    const X=d=>ml+(d-lo)/(hi-lo)*(W-ml-mr), Y=p=>mt+(1-p)*(H-mt-mb);
    let path=''; for(let d=lo;d<=hi+1e-9;d+=0.005){ path+=(path?'L':'M')+X(d).toFixed(1)+','+Y(P(d)).toFixed(1); }
    const xt=[-0.4,-0.3,-0.2,-0.1,0,0.1,0.2,0.3], yt=[0,0.25,0.5,0.75,1];
    const pts=dm.filter(v=>v>=lo&&v<=hi).map(v=>`<circle cx="${X(v).toFixed(1)}" cy="${H-mb+8}" r="3" fill="var(--dot-soft)" stroke="var(--dot)"><title>Oferta más baja: ${pct(v)}</title></circle>`).join('');
    $('ccurve').innerHTML=`<svg class="curve" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Probabilidad de ser la oferta más baja según el desvío">
      ${yt.map(p=>`<line x1="${ml}" x2="${W-mr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${ml-6}" y="${Y(p)+4}" text-anchor="end">${p*100} %</text>`).join('')}
      ${xt.map(d=>`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d===0?'0':(d>0?'+':'−')+Math.abs(d*100)+'%'}</text>`).join('')}
      <line x1="${X(0)}" x2="${X(0)}" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-dasharray="3 3"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${R3.filter(x=>x.d!=null&&x.d>=lo&&x.d<=hi).map(x=>`<circle cx="${X(x.d)}" cy="${Y(P(x.d))}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${Math.round(x.p*100)} %: ${pct(x.d)}</title></circle>`).join('')}
      ${pts}</svg><div class="note">Eje horizontal: oferta respecto del presupuesto oficial. Vertical: proporción de licitaciones en las que esa oferta habría sido la más baja. Los puntos de abajo son la oferta más baja de cada licitación del grupo.</div>`;
  };
  $('cg').onchange=e=>{S.calcG=e.target.value; draw();};
  $('cpo').oninput=e=>{S.calcPO=e.target.value; draw();};
  draw();
}

/* ---------- método ---------- */
function renderMetodo(){
  const ks=Object.keys(ICC).sort();
  $('out').innerHTML=`<div class="method">
  <section><h3>Desvío de oferta</h3><p><code>d = oferta / (PO × F) − 1</code></p><p>PO es el presupuesto oficial. F ajusta el PO a la fecha de apertura: <code>F = ICC(mes de apertura) / ICC(mes base del PO)</code>. Si el pliego no dice el mes base se usa el de publicación. Si falta algún mes del índice, F = 1 y el desvío queda nominal.</p><p>Se descartan como implausibles las ofertas con <code>oferta/(PO×F)</code> fuera de 0,4 a 2,5 (suele ser un presupuesto por renglón comparado contra una oferta total, o un error de carga).</p></section>
  <section><h3>Tasa de éxito y margen</h3><p><code>tasa = ganadas / presentaciones en licitaciones resueltas</code> (adjudicadas, preadjudicadas, fracasadas o desiertas).</p><p><code>margen al ganar = (2ª oferta − oferta ganadora) / oferta ganadora</code>, solo cuando ganó la oferta más baja: es lo que el ganador dejó sobre la mesa.</p><p>En una UT cada integrante suma la presentación y la victoria.</p></section>
  <section><h3>Calculadora de oferta</h3><p><code>P(ganar | d) = proporción de licitaciones del grupo con d_mín &gt; d</code>, donde d_mín es el desvío de la oferta más baja admitida.</p><p>Supuestos: gana la más baja admitida; las licitaciones del grupo son comparables; la competencia futura se parece a la pasada. No modela la calificación técnica ni la cantidad de oferentes.</p></section>
  <section><h3>Índice de costo de la construcción</h3><p>${esc(ICCMETA.fuente||'ICC del INDEC, nivel general.')}</p><p>${ks.length?`Meses cargados: ${ks[0]} a ${ks[ks.length-1]} (${ks.length}).`:'Todavía no hay meses cargados: los desvíos son nominales.'} ${esc(ICCMETA.nota||'')}</p></section>
  <section><h3>Datos y fuentes</h3><p>Cada licitación lleva su fuente y su tipo: oficial (boletín, portal de compras, actas), prensa oficial (portales de prensa de gobiernos) o secundaria (diarios). Las secundarias se pueden excluir con el filtro de arriba.</p><p>Las empresas se identifican por su nombre normalizado (sin tildes, signos ni S.A./S.R.L.). Centro Construcciones S.A. y CECOSA S.A. se cuentan como la misma empresa.</p><p>La fecha de cada licitación es la de adjudicación, o si no la de apertura, o si no la de publicación.</p></section>
  <section><h3>Cómo se alimenta</h3><p>La rutina diaria del Radar agrega acá cada apertura y adjudicación que releva, con todos los oferentes y sus montos. Lo cargado no se borra: se completa.</p><p>${esc(META.nota||'')}</p></section>
  </div>`;
}

function mergeLive(c){

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lic),'Licitaciones');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(of),'Ofertas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(em),'Empresas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pr),'Precios');
  if(CONTOK){
    const NX={mail:'Escribir por mail',tel:'Llamar',busc:'Buscar contacto',esperar:'Esperar respuesta',seg:'Hacer seguimiento'};
    const ct=contactos().sort((a,b)=>b._pres-a._pres).map(c=>({Empresa:c.empresa,Otros_nombres:c.otros_nombres||'',Email:c.email||'',Telefono:c.telefono||'',Web:c.web||'',Ciudad:c.ciudad||'',Jurisdicciones:c.jurisdicciones||'',
      Presentaciones:c._pres,Ganadas:c._gan,Licitaciones:c.licitaciones||'',Contactada:c._sent?'sí':'no',
      Contactos:c._cs.map(x=>`${x.fecha} ${x.tipo==='especifico'?'Por licitación: '+(x.licitacion||''):'General'} (${x.estado||''})${x.respuesta?' — respuesta: '+x.respuesta:''}`).join(' | '),
      Proximo_paso:NX[c._next]}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ct),'Contactos');
  }
  if(EVENTOS.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(EVENTOS.map(d=>d.data||{}).map(e=>({Fecha_hora:fdt(evFecha(e)),Quien:e.quien||'',Accion:EVT[e.tipo]||e.tipo||'',Licitacion:e.licitacion||'',Objeto:e.objeto||'',Empresa:e.empresa||'',Email:e.email||'',Detalle:e.detalle||''}))),'Registro'); }
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  if(!dl){ toast('La descarga solo funciona abriendo la página desde claude.ai.'); return; }
  try{ await dl.save({filename:'memoria-licitaciones.xlsx',data:buf}); toast('Excel listo'); }
  catch(e){ if(e&&e.code!=='declined') toast('No se pudo guardar el archivo ('+(e&&e.code||'error')+').'); }
}
$('xlsBtn').onclick=exportXls;

/* ---------- carga desde la base ---------- */
async function load(){
  let db=null; try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){ db=null; }
  if(!db){ $('meta').textContent='Sin conexión con la base'; $('out').innerHTML='<div class="empty">No se pudo leer la base histórica. Recargá la página.</div>'; return; }
  DB=db;
  try{
    const [lic,cfg,fu]=await Promise.all([db.collection('licitaciones').limit(1000).get(),db.doc('config/indices').get(),db.collection('fuentes').limit(100).get()]);
    R=lic.docs.map(d=>({id:d.id,...d.data()}));
    if(cfg.exists){ const c=cfg.data(); ICC=c.icc||{}; ICCMETA=c; }
    FUENTES=fu.docs.map(d=>d.data());
    const m=await db.doc('config/meta').get(); if(m.exists) META=m.data();
    const a=await db.doc('config/alias').get(); if(a.exists&&a.data().pares) a.data().pares.forEach(([x,y])=>{ALIAS[x]=y;});
    try{ const ct=await db.collection('contactos').limit(200).get();
      CONT=ct.docs.map(d=>d.data()).sort((x,y)=>(x.lote||0)-(y.lote||0)).flatMap(d=>Array.isArray(d.items)?d.items:[]);
      CONTOK=CONT.length>0; }catch(e){ CONTOK=false; }
  }catch(e){ $('meta').textContent='No se pudo leer la base ('+(e&&e.code||'error')+')'; return; }
  if(!R.length){ $('meta').textContent='Base vacía'; $('out').innerHTML='<div class="empty">La base todavía no tiene licitaciones. La rutina diaria del Radar las carga en su próxima corrida.</div>'; return; }
  const fr=R.map(r=>r.fecha_adjudicacion||r.fecha_apertura||r.fecha_publicacion).filter(Boolean).sort();
  $('meta').innerHTML=`<b>${R.length}</b> licitaciones · ${fdate(fr[0])} al ${fdate(fr[fr.length-1])}<br>Actualizada ${fdate(META.actualizado)}`;
  $('xlsBtn').disabled=false;
  D=R.map(derive); selects(); render();
  if(db.live){
    db.live('envios',docs=>{ ENVLIVE=docs; liveRender('contactos'); });
    db.live('eventos',docs=>{ EVENTOS=docs; EVOK=true; if(S.tab==='registro') liveRender('registro'); else $('c-registro').textContent=docs.length||''; },{orderBy:'ts',dir:'desc',limit:3000})
      .then(u=>{ if(!u){ EVERR=true; liveRender('registro'); } });
  }
}

/* ---------- modo día / oscuro ---------- */
const root=document.documentElement, mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
try{const th=localStorage.getItem('radar-theme'); if(th==='dark'||th==='light') root.setAttribute('data-theme',th);}catch(e){}
const isDark=()=>{const a=root.getAttribute('data-theme'); return a?a==='dark':!!(mq&&mq.matches);};
const paint=()=>{$('themeBtn').textContent=isDark()?'☀ Modo día':'☾ Modo oscuro';};
$('themeBtn').onclick=()=>{const n=isDark()?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('radar-theme',n)}catch(e){} paint();};
if(mq&&mq.addEventListener) mq.addEventListener('change',paint);
paint(); render(); load();
})();
</script>
